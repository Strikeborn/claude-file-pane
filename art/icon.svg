<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Files pane: an open folder holding a page of text, and a pencil writing on the page (browse files, edit them).
       The same dark rounded square and glow as Model Organizer's icon. Rendered by art/make-icon.mjs to
       .claude-plugin/icon.png (the plugin directory's listing icon). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232c42"/>
      <stop offset="1" stop-color="#0b0f18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- folder back, with its tab -->
  <path d="M40 78 a10 10 0 0 1 10 -10 h44 l14 14 h70 a10 10 0 0 1 10 10 v108 a10 10 0 0 1 -10 10 h-128 a10 10 0 0 1 -10 -10 z" fill="url(#back)"/>

  <!-- the page, standing up out of the folder: a heading and lines of text, one being written -->
  <g transform="rotate(-6 118 120)">
    <rect x="70" y="38" width="104" height="136" rx="8" fill="url(#page)"/>
    <rect x="84" y="54" width="52" height="9" rx="4.5" fill="#4338ca"/>
    <rect x="84" y="74" width="74" height="6" rx="3" fill="#94a3b8"/>
    <rect x="84" y="88" width="64" height="6" rx="3" fill="#94a3b8"/>
    <rect x="84" y="102" width="70" height="6" rx="3" fill="#94a3b8"/>
    <rect x="84" y="116" width="30" height="6" rx="3" fill="#2dd4bf"/>
  </g>

  <!-- folder front, open toward us -->
  <path d="M32 138 a10 10 0 0 1 10 -10 h148 a10 10 0 0 1 9.8 12 l-11.9 58 a10 10 0 0 1 -9.8 8 h-128.1 a10 10 0 0 1 -10 -10 z" fill="url(#front)"/>
  <path d="M44 142 h140" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

  <!-- the pencil, writing where the teal line ends -->
  <g transform="translate(-41.6 -32.4) rotate(-45 176 132)">
    <rect x="176" y="120" width="84" height="24" rx="3" fill="url(#body)"/>
    <rect x="176" y="120" width="84" height="8" rx="3" fill="#a5b4fc" opacity="0.6"/>
    <rect x="248" y="120" width="12" height="24" rx="3" fill="#f472b6"/>
    <rect x="240" y="120" width="8" height="24" fill="#cbd5e1"/>
    <path d="M176 120 l-26 12 l26 12 z" fill="#fcd9b6"/>
    <path d="M158 128.3 l-8 3.7 l8 3.7 z" fill="#1e293b"/>
  </g>
</svg>
